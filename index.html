<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Only Bitcoin</title>
<style>
  :root{
    --orange:#f7931a;
    --red:#ef4444;
    --green:#16a34a;
    --gray:#9ca3af;
    --track:#e5e7eb;
    --bg:#ffffff;
    --text:#111111;
    --sub:#8b8b8b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    padding:20px 20px 40px;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .coin-icon{
    width:40px;height:40px;border-radius:50%;
    background:var(--orange);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:700;
    flex-shrink:0;
  }
  .topbar h1{
    font-size:28px;margin:0;flex:1;font-weight:700;
  }
  .live-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 0 rgba(22,163,74,.6);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(22,163,74,.5);}
    70%{box-shadow:0 0 0 8px rgba(22,163,74,0);}
    100%{box-shadow:0 0 0 0 rgba(22,163,74,0);}
  }
  .price-block{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:20px;
    gap:10px;
  }
  .price-main .price-krw{
    font-size:30px;font-weight:700;line-height:1.3;
  }
  .price-main .price-usd{
    font-size:20px;color:var(--sub);font-weight:600;
  }
  .price-side{
    display:flex;flex-direction:column;align-items:flex-end;gap:6px;
  }
  .change-rows{
    display:flex;flex-direction:column;gap:4px;align-items:flex-end;
  }
  .change-row{
    font-size:15px;font-weight:700;display:flex;align-items:center;gap:3px;
  }
  .change-row.up{color:var(--green);}
  .change-row.down{color:var(--red);}
  .change-row.flat{color:var(--gray);}
  #sparkline{display:block;}

  .stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    padding:16px 0;
    border-top:1px solid var(--track);
    border-bottom:1px solid var(--track);
    margin-bottom:24px;
  }
  .stat{display:flex;flex-direction:column;gap:6px;}
  .stat-label{font-size:12px;color:var(--sub);}
  .stat-value{font-size:17px;font-weight:700;}

  .chart-section{margin-bottom:28px;}
  .chart-canvas-wrap{position:relative;}
  #priceChart{width:100%;display:block;touch-action:none;}
  .chart-tooltip{
    position:absolute;
    top:0;
    padding:4px 10px;
    border:1px solid var(--text);
    border-radius:6px;
    font-size:13px;font-weight:700;
    background:#fff;
    pointer-events:none;
    white-space:nowrap;
    display:none;
  }
  .chart-legend{
    display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-bottom:4px;
  }
  .tooltip-date{font-weight:600;color:var(--sub);font-size:11px;}
  .chart-legend .item{display:flex;align-items:center;gap:4px;}
  .chart-legend .item.dimmed{opacity:0.35;}
  .chart-legend .swatch{width:10px;height:2px;display:inline-block;}
  .rsi-wrap{margin-top:6px;}
  .rsi-header{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:2px;}
  #rsiChart{width:100%;display:block;}
  .range-tabs{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
    gap:4px;
  }
  .range-tabs button{
    flex:1;
    border:none;background:transparent;
    color:var(--sub);
    font-family:inherit;font-size:14px;font-weight:600;
    padding:8px 4px;border-radius:16px;
    cursor:pointer;
  }
  .range-tabs button.active{
    background:var(--text);color:#fff;
  }

  .halving-section h2{
    font-size:20px;margin:0 0 14px;
  }
  .halving-row{
    display:flex;align-items:center;gap:12px;margin-bottom:14px;
  }
  .halving-bar{
    position:relative;
    flex:1;height:26px;border-radius:4px;overflow:hidden;
    background:repeating-linear-gradient(90deg,var(--track) 0 6px, #fff 6px 9px);
  }
  .halving-fill{
    position:absolute;top:0;left:0;height:100%;width:0%;
    background:repeating-linear-gradient(90deg,var(--text) 0 6px, #fff 6px 9px);
  }
  .halving-pct{font-size:20px;font-weight:700;white-space:nowrap;}
  .halving-info{
    display:flex;justify-content:space-between;
    padding-top:10px;
  }
  .halving-info > div{display:flex;flex-direction:column;gap:4px;}
  .halving-info .label{font-size:12px;color:var(--sub);}
  .halving-info span:last-child{font-size:16px;font-weight:700;}
  .halving-info > div + div{border-left:1px solid var(--track);padding-left:16px;}

  .tagline{
    text-align:center;font-weight:700;font-size:14px;
    margin-top:32px;
  }
  .status-line{
    text-align:center;font-size:11px;color:var(--sub);margin-top:8px;min-height:14px;
  }
  .source-note{
    text-align:center;font-size:13px;margin-top:20px;
  }
  .source-note a{color:var(--orange);text-decoration:none;font-weight:600;}

  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f0f0f;
      --text:#f2f2f2;
      --sub:#8f8f8f;
      --track:#2a2a2a;
    }
    .chart-tooltip{background:#0f0f0f;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="coin-icon">₿</div>
    <h1>Bitcoin</h1>
    <span class="live-dot" title="실시간 연결됨"></span>
  </header>

  <section class="price-block">
    <div class="price-main">
      <div class="price-krw">₩<span id="priceKrw">-</span></div>
      <div class="price-usd">$<span id="priceUsd">-</span></div>
    </div>
    <div class="price-side">
      <div class="change-rows">
        <div class="change-row" id="changeKrwRow"><span class="tri"></span><span id="changeKrw">-</span></div>
        <div class="change-row" id="changeUsdRow"><span class="tri"></span><span id="changeUsd">-</span></div>
      </div>
      <canvas id="sparkline" width="110" height="56"></canvas>
    </div>
  </section>

  <section class="stats-grid">
    <div class="stat"><span class="stat-label">BTC.D</span><span class="stat-value" id="statDominance">-</span></div>
    <div class="stat"><span class="stat-label">KRW/USD</span><span class="stat-value" id="statFx">-</span></div>
    <div class="stat"><span class="stat-label">Premium</span><span class="stat-value" id="statPremium">-</span></div>
    <div class="stat"><span class="stat-label">F&G Index</span><span class="stat-value" id="statFng">-</span></div>
  </section>

  <section class="chart-section">
    <div class="chart-legend">
      <span class="item"><span class="swatch" style="background:#f7931a;"></span>Price</span>
      <span class="item" id="legendMa200d"><span class="swatch" style="background:#3b82f6;"></span>MA 200D</span>
      <span class="item" id="legendMa200w"><span class="swatch" style="background:#14b8a6;"></span>MA 200W</span>
    </div>
    <div class="chart-canvas-wrap">
      <div class="chart-tooltip" id="chartTooltip"></div>
      <canvas id="priceChart" height="220"></canvas>
    </div>
    <div class="rsi-wrap">
      <div class="rsi-header"><span>RSI(14)</span><span id="rsiValue">-</span></div>
      <canvas id="rsiChart" height="60"></canvas>
    </div>
    <div class="range-tabs" id="rangeTabs">
      <button data-range="1D">1D</button>
      <button data-range="7D">7D</button>
      <button data-range="1M">1M</button>
      <button data-range="1Y" class="active">1Y</button>
      <button data-range="5Y">5Y</button>
      <button data-range="ALL">All</button>
    </div>
  </section>

  <section class="halving-section">
    <h2>Bitcoin Halving</h2>
    <div class="halving-row">
      <div class="halving-bar"><div class="halving-fill" id="halvingFill"></div></div>
      <div class="halving-pct" id="halvingPct">-</div>
    </div>
    <div class="halving-info">
      <div><span class="label">Current</span><span id="halvingCurrent">-</span></div>
      <div><span class="label">Remaining</span><span id="halvingRemaining">-</span></div>
      <div><span class="label">Estimated Date</span><span id="halvingDate">-</span></div>
    </div>
  </section>

  <p class="tagline">Stay humble and stack sats.</p>
  <p class="status-line" id="statusLine">&nbsp;</p>
  <p class="source-note"><a href="etf.html">Bitcoin ETF Flow →</a> &nbsp;|&nbsp; <a href="assets.html">Global Assets by Market Cap →</a></p>
</div>

<script>
(function(){
  "use strict";

  const LAST_HALVING_BLOCK = 840000;
  const HALVING_INTERVAL = 210000;
  const AVG_BLOCK_MINUTES = 10;
  const MA_PERIOD = 200;
  const RSI_PERIOD = 14;

  const RANGE_CONFIG = {
    "1D": { interval: "15m", limit: 96 },
    "7D": { interval: "1h", limit: 168 },
    "1M": { interval: "4h", limit: 180 },
    "1Y": { interval: "1d", limit: 365 },
    "5Y": { interval: "1w", limit: 260 },
    "ALL": { interval: "1M", limit: 96 }
  };

  const state = {
    krwPrice: null,
    usdPrice: null,
    fxRate: null,
    range: "1Y",
    chartPoints: [],
    ma200d: [],
    ma200w: [],
    rsiPoints: []
  };

  const els = {
    priceKrw: document.getElementById("priceKrw"),
    priceUsd: document.getElementById("priceUsd"),
    changeKrwRow: document.getElementById("changeKrwRow"),
    changeUsdRow: document.getElementById("changeUsdRow"),
    changeKrw: document.getElementById("changeKrw"),
    changeUsd: document.getElementById("changeUsd"),
    statDominance: document.getElementById("statDominance"),
    statFx: document.getElementById("statFx"),
    statPremium: document.getElementById("statPremium"),
    statFng: document.getElementById("statFng"),
    halvingFill: document.getElementById("halvingFill"),
    halvingPct: document.getElementById("halvingPct"),
    halvingCurrent: document.getElementById("halvingCurrent"),
    halvingRemaining: document.getElementById("halvingRemaining"),
    halvingDate: document.getElementById("halvingDate"),
    statusLine: document.getElementById("statusLine"),
    tooltip: document.getElementById("chartTooltip"),
  };

  const sparkCanvas = document.getElementById("sparkline");
  const chartCanvas = document.getElementById("priceChart");
  const rsiCanvas = document.getElementById("rsiChart");
  const rsiValueEl = document.getElementById("rsiValue");

  // Simple moving average; entries before `period` samples exist are null.
  function computeSMA(values, period){
    const out = new Array(values.length).fill(null);
    let sum = 0;
    for(let i=0;i<values.length;i++){
      sum += values[i];
      if(i >= period) sum -= values[i-period];
      if(i >= period-1) out[i] = sum/period;
    }
    return out;
  }

  // Wilder's RSI; entries before `period` samples exist are null.
  function computeRSI(values, period){
    const out = new Array(values.length).fill(null);
    if(values.length <= period) return out;
    let gainSum = 0, lossSum = 0;
    for(let i=1;i<=period;i++){
      const diff = values[i] - values[i-1];
      if(diff >= 0) gainSum += diff; else lossSum -= diff;
    }
    let avgGain = gainSum/period, avgLoss = lossSum/period;
    out[period] = avgLoss === 0 ? 100 : 100 - (100/(1+avgGain/avgLoss));
    for(let i=period+1;i<values.length;i++){
      const diff = values[i] - values[i-1];
      const gain = diff > 0 ? diff : 0;
      const loss = diff < 0 ? -diff : 0;
      avgGain = (avgGain*(period-1) + gain)/period;
      avgLoss = (avgLoss*(period-1) + loss)/period;
      out[i] = avgLoss === 0 ? 100 : 100 - (100/(1+avgGain/avgLoss));
    }
    return out;
  }

  function setStatus(msg){
    els.statusLine.textContent = msg || " ";
  }

  async function fetchJson(url, timeoutMs){
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), timeoutMs || 8000);
    try{
      const res = await fetch(url, { signal: controller.signal });
      if(!res.ok) throw new Error(url + " -> " + res.status);
      return await res.json();
    } finally {
      clearTimeout(t);
    }
  }

  function fmtInt(n){
    return Math.round(n).toLocaleString("en-US");
  }
  function fmtUsd(n){
    return n.toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  }
  function fmtPct(n){
    return Math.abs(n).toFixed(2) + "%";
  }

  function fmtAxisDate(ts){
    const d = new Date(ts);
    if(state.range === "1D") return d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: false });
    if(state.range === "5Y" || state.range === "ALL") return d.toLocaleDateString("en-US", { month: "short", year: "numeric" });
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }

  function fmtTooltipDate(ts){
    const d = new Date(ts);
    if(state.range === "1D") return d.toLocaleString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
    return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  }

  function applyChangeRow(rowEl, valueEl, pct){
    valueEl.textContent = fmtPct(pct);
    rowEl.classList.remove("up","down","flat");
    const tri = rowEl.querySelector(".tri");
    if(pct > 0.005){ rowEl.classList.add("up"); tri.textContent = "▲"; }
    else if(pct < -0.005){ rowEl.classList.add("down"); tri.textContent = "▼"; }
    else { rowEl.classList.add("flat"); tri.textContent = "–"; }
  }

  function updatePremium(){
    if(state.krwPrice == null || state.usdPrice == null || state.fxRate == null) return;
    const impliedUsd = state.krwPrice / state.fxRate;
    const premium = (impliedUsd / state.usdPrice - 1) * 100;
    els.statPremium.textContent = (premium >= 0 ? "+" : "") + premium.toFixed(2) + "%";
    els.statPremium.style.color = premium >= 0 ? "var(--green)" : "var(--red)";
  }

  // ---- Price (Upbit KRW + Binance USD, independent so one failing doesn't block the other) ----
  async function updatePrice(){
    const failures = [];

    try{
      const upbit = await fetchJson("https://api.upbit.com/v1/ticker?markets=KRW-BTC");
      const u = upbit[0];
      state.krwPrice = u.trade_price;
      els.priceKrw.textContent = fmtInt(u.trade_price);
      applyChangeRow(els.changeKrwRow, els.changeKrw, u.signed_change_rate * 100);
    }catch(e){
      failures.push("KRW(Upbit): " + e.message);
    }

    try{
      const binance = await fetchJson("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT");
      state.usdPrice = parseFloat(binance.lastPrice);
      els.priceUsd.textContent = fmtUsd(state.usdPrice);
      applyChangeRow(els.changeUsdRow, els.changeUsd, parseFloat(binance.priceChangePercent));
    }catch(e){
      try{
        // Binance blocks some regions; CoinGecko has no such restriction.
        const cg = await fetchJson("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true");
        state.usdPrice = cg.bitcoin.usd;
        els.priceUsd.textContent = fmtUsd(state.usdPrice);
        applyChangeRow(els.changeUsdRow, els.changeUsd, cg.bitcoin.usd_24h_change);
      }catch(e2){
        failures.push("USD(Binance/CoinGecko): " + e2.message);
      }
    }

    updatePremium();
    setStatus(failures.length ? "일부 가격 실패: " + failures.join(" / ") : "");
  }

  // ---- Mini sparkline (Upbit last 10 days) ----
  async function updateSparkline(){
    try{
      const candles = await fetchJson("https://api.upbit.com/v1/candles/days?market=KRW-BTC&count=10");
      candles.reverse();
      drawSparkline(candles);
    }catch(e){ /* non-critical */ }
  }

  function drawSparkline(candles){
    const dpr = window.devicePixelRatio || 1;
    const w = sparkCanvas.clientWidth || 110, h = sparkCanvas.clientHeight || 56;
    sparkCanvas.width = w * dpr; sparkCanvas.height = h * dpr;
    const ctx = sparkCanvas.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    const highs = candles.map(c=>c.high_price), lows = candles.map(c=>c.low_price);
    const max = Math.max(...highs), min = Math.min(...lows);
    const range = (max - min) || 1;
    const barW = w / candles.length;
    candles.forEach((c, i) => {
      const up = c.trade_price >= c.opening_price;
      ctx.fillStyle = up ? "#16a34a" : "#ef4444";
      const x = i * barW + barW * 0.3;
      const bw = barW * 0.4;
      const yHigh = h - ((c.high_price - min) / range) * h;
      const yLow = h - ((c.low_price - min) / range) * h;
      ctx.fillRect(x, Math.min(yHigh,yLow), Math.max(bw,2), Math.max(Math.abs(yLow-yHigh),2));
    });
  }

  // ---- Stats: BTC.D, FX, F&G ----
  async function updateDominance(){
    try{
      const g = await fetchJson("https://api.coingecko.com/api/v3/global");
      els.statDominance.textContent = g.data.market_cap_percentage.btc.toFixed(1) + "%";
    }catch(e){ /* keep previous */ }
  }

  async function updateFx(){
    try{
      const fx = await fetchJson("https://open.er-api.com/v6/latest/USD");
      state.fxRate = fx.rates.KRW;
      els.statFx.textContent = fmtInt(state.fxRate);
      updatePremium();
    }catch(e){ /* keep previous */ }
  }

  async function updateFng(){
    try{
      const fng = await fetchJson("https://api.alternative.me/fng/?limit=1");
      const d = fng.data[0];
      els.statFng.textContent = d.value;
      const v = parseInt(d.value, 10);
      let color = "var(--gray)";
      if(v <= 24) color = "var(--red)";
      else if(v <= 44) color = "#f97316";
      else if(v <= 55) color = "var(--gray)";
      else if(v <= 75) color = "#84cc16";
      else color = "var(--green)";
      els.statFng.style.color = color;
    }catch(e){ /* keep previous */ }
  }

  // ---- Halving ----
  async function updateHalving(){
    try{
      const text = await (await fetch("https://mempool.space/api/blocks/tip/height")).text();
      const height = parseInt(text, 10);
      const epochStart = Math.floor(height / HALVING_INTERVAL) * HALVING_INTERVAL;
      const nextHalving = epochStart + HALVING_INTERVAL;
      const remaining = nextHalving - height;
      const progress = ((height - epochStart) / HALVING_INTERVAL) * 100;
      const etaMs = Date.now() + remaining * AVG_BLOCK_MINUTES * 60 * 1000;
      const eta = new Date(etaMs);

      els.halvingFill.style.width = progress.toFixed(2) + "%";
      els.halvingPct.textContent = progress.toFixed(2) + "%";
      els.halvingCurrent.textContent = fmtInt(height);
      els.halvingRemaining.textContent = fmtInt(remaining);
      els.halvingDate.textContent = eta.getFullYear() + "." + String(eta.getMonth()+1).padStart(2,"0") + "." + String(eta.getDate()).padStart(2,"0");
    }catch(e){ /* keep previous */ }
  }

  // Fixed 200-day and 200-week moving averages, independent of the
  // selected range, so they mean the same thing on every tab. Refreshed
  // on their own slow interval since they barely move within a day.
  async function updateLongTermMAs(){
    try{
      const [dailyKlines, weeklyKlines] = await Promise.all([
        fetchJson("https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1000"),
        fetchJson("https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1w&limit=1000")
      ]);
      const buildSeries = (klines) => {
        const times = klines.map(k => k[0]);
        const closes = klines.map(k => parseFloat(k[4]));
        const ma = computeSMA(closes, MA_PERIOD);
        return times.map((t,i) => ({ t, v: ma[i] })).filter(p => p.v != null);
      };
      state.ma200d = buildSeries(dailyKlines);
      state.ma200w = buildSeries(weeklyKlines);
      drawChart();
    }catch(e){ /* keep previous */ }
  }

  // Step-function lookup: latest value in `series` at or before time `t`.
  function valueAtOrBefore(series, t){
    if(!series.length || t < series[0].t) return null;
    let lo = 0, hi = series.length - 1, ans = null;
    while(lo <= hi){
      const mid = (lo + hi) >> 1;
      if(series[mid].t <= t){ ans = series[mid].v; lo = mid + 1; }
      else hi = mid - 1;
    }
    return ans;
  }

  // ---- Main chart ----
  async function updateChart(range){
    const cfg = RANGE_CONFIG[range];
    try{
      // Fetch a little extra history so RSI(14) is already "warmed up"
      // for the very first point shown in the visible range.
      const fetchLimit = Math.min(1000, cfg.limit + RSI_PERIOD);
      const klines = await fetchJson(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${cfg.interval}&limit=${fetchLimit}`);
      const allPoints = klines.map(k => ({ t: k[0], v: parseFloat(k[4]) }));
      const closes = allPoints.map(p => p.v);
      const rsiAll = computeRSI(closes, RSI_PERIOD);

      const sliceStart = Math.max(0, allPoints.length - cfg.limit);
      state.chartPoints = allPoints.slice(sliceStart);
      state.rsiPoints = rsiAll.slice(sliceStart);
      drawChart();
      drawRsi();
    }catch(e){
      setStatus("차트 로드 실패: " + e.message);
    }
  }

  function drawChart(highlightIndex){
    const points = state.chartPoints;
    if(!points || points.length === 0) return;
    const dpr = window.devicePixelRatio || 1;
    const w = chartCanvas.clientWidth, h = chartCanvas.clientHeight || 220;
    chartCanvas.width = w * dpr; chartCanvas.height = h * dpr;
    const ctx = chartCanvas.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);

    const values = points.map(p=>p.v);
    // Long-term MAs are hidden on very short ranges: they'd sit far off
    // from intraday price action and just compress the visible detail.
    const showMa = state.range !== "1D" && state.range !== "7D";
    const ma200dLine = showMa ? points.map(p => valueAtOrBefore(state.ma200d, p.t)) : points.map(() => null);
    const ma200wLine = showMa ? points.map(p => valueAtOrBefore(state.ma200w, p.t)) : points.map(() => null);
    const maValues = ma200dLine.concat(ma200wLine).filter(v => v != null);
    document.getElementById("legendMa200d").classList.toggle("dimmed", !showMa);
    document.getElementById("legendMa200w").classList.toggle("dimmed", !showMa);
    const scaleValues = values.concat(maValues);
    const max = Math.max(...scaleValues), min = Math.min(...scaleValues);
    const vRange = (max - min) || 1;
    const padTop = 30, padBottom = 22;
    const plotH = h - padTop - padBottom;

    const xAt = i => (i / (points.length - 1)) * w;
    const yAt = v => padTop + plotH - ((v - min) / vRange) * plotH;

    // dashed gridlines
    ctx.strokeStyle = "rgba(150,150,150,0.25)";
    ctx.setLineDash([4,4]);
    ctx.lineWidth = 1;
    for(let i=0;i<=2;i++){
      const y = padTop + (plotH/2)*i;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
    }
    ctx.setLineDash([]);

    // area fill
    const grad = ctx.createLinearGradient(0,padTop,0,h);
    grad.addColorStop(0, "rgba(247,147,26,0.35)");
    grad.addColorStop(1, "rgba(247,147,26,0.02)");
    ctx.beginPath();
    ctx.moveTo(xAt(0), yAt(points[0].v));
    points.forEach((p,i) => ctx.lineTo(xAt(i), yAt(p.v)));
    ctx.lineTo(w, h - padBottom);
    ctx.lineTo(0, h - padBottom);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // line
    ctx.beginPath();
    points.forEach((p,i) => i===0 ? ctx.moveTo(xAt(i), yAt(p.v)) : ctx.lineTo(xAt(i), yAt(p.v)));
    ctx.strokeStyle = "#f7931a";
    ctx.lineWidth = 2;
    ctx.stroke();

    // 200-day / 200-week moving average overlays
    function strokeMaLine(line, color){
      let started = false;
      ctx.beginPath();
      line.forEach((v, i) => {
        if(v == null){ started = false; return; }
        if(!started){ ctx.moveTo(xAt(i), yAt(v)); started = true; }
        else ctx.lineTo(xAt(i), yAt(v));
      });
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    strokeMaLine(ma200dLine, "#3b82f6");
    strokeMaLine(ma200wLine, "#14b8a6");

    // date ticks along the bottom axis
    const tickCount = Math.min(5, points.length);
    const tickIdx = new Set();
    for(let i=0;i<tickCount;i++){
      tickIdx.add(Math.round(i * (points.length - 1) / (tickCount - 1 || 1)));
    }
    const sortedTicks = [...tickIdx].sort((a,b) => a-b);
    ctx.fillStyle = "rgba(140,140,140,0.9)";
    ctx.font = "10px ui-monospace, monospace";
    sortedTicks.forEach((i, idx) => {
      const x = xAt(i);
      ctx.textAlign = idx === 0 ? "left" : idx === sortedTicks.length - 1 ? "right" : "center";
      const clampedX = idx === 0 ? Math.max(2, x) : idx === sortedTicks.length - 1 ? Math.min(w - 2, x) : x;
      ctx.fillText(fmtAxisDate(points[i].t), clampedX, h - 6);
    });

    // peak marker (based on price high, not the combined price+MA scale)
    const priceMax = Math.max(...values);
    const peakIdx = values.indexOf(priceMax);
    ctx.beginPath();
    ctx.arc(xAt(peakIdx), yAt(priceMax), 4, 0, Math.PI*2);
    ctx.fillStyle = "#f7931a";
    ctx.fill();

    els.tooltip.style.display = "block";
    els.tooltip.innerHTML = "$" + fmtUsd(priceMax) + ` <span class="tooltip-date">${fmtTooltipDate(points[peakIdx].t)}</span>`;
    let peakX = xAt(peakIdx) - els.tooltip.offsetWidth/2;
    peakX = Math.max(0, Math.min(w - els.tooltip.offsetWidth, peakX));
    els.tooltip.style.left = peakX + "px";

    if(highlightIndex != null){
      const p = points[highlightIndex];
      ctx.beginPath();
      ctx.moveTo(xAt(highlightIndex), padTop);
      ctx.lineTo(xAt(highlightIndex), h - padBottom);
      ctx.strokeStyle = "rgba(100,100,100,0.5)";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(xAt(highlightIndex), yAt(p.v), 4, 0, Math.PI*2);
      ctx.fillStyle = "#111";
      ctx.fill();
      els.tooltip.innerHTML = "$" + fmtUsd(p.v) + ` <span class="tooltip-date">${fmtTooltipDate(p.t)}</span>`;
      let hx = xAt(highlightIndex) - els.tooltip.offsetWidth/2;
      hx = Math.max(0, Math.min(w - els.tooltip.offsetWidth, hx));
      els.tooltip.style.left = hx + "px";
    }
  }

  function drawRsi(highlightIndex){
    const points = state.rsiPoints || [];
    const w = rsiCanvas.clientWidth, h = rsiCanvas.clientHeight || 60;
    const dpr = window.devicePixelRatio || 1;
    rsiCanvas.width = w * dpr; rsiCanvas.height = h * dpr;
    const ctx = rsiCanvas.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    if(!points.length) return;

    const xAt = i => (i / (points.length - 1)) * w;
    const yAt = v => h - (v/100) * h;

    ctx.strokeStyle = "rgba(150,150,150,0.3)";
    ctx.setLineDash([3,3]);
    ctx.lineWidth = 1;
    [30,50,70].forEach(level => {
      const y = yAt(level);
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
    });
    ctx.setLineDash([]);

    let started = false;
    ctx.beginPath();
    points.forEach((v,i) => {
      if(v == null){ started = false; return; }
      if(!started){ ctx.moveTo(xAt(i), yAt(v)); started = true; }
      else ctx.lineTo(xAt(i), yAt(v));
    });
    ctx.strokeStyle = "#8b5cf6";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    const idx = highlightIndex != null ? highlightIndex : points.length - 1;
    const shown = points[idx] != null ? points[idx] : [...points].reverse().find(v => v != null);
    if(shown != null){
      rsiValueEl.textContent = shown.toFixed(1);
      rsiValueEl.style.color = shown >= 70 ? "var(--red)" : shown <= 30 ? "var(--green)" : "var(--text)";
    } else {
      rsiValueEl.textContent = "-";
      rsiValueEl.style.color = "var(--text)";
    }

    if(highlightIndex != null){
      ctx.beginPath();
      ctx.moveTo(xAt(highlightIndex), 0);
      ctx.lineTo(xAt(highlightIndex), h);
      ctx.strokeStyle = "rgba(100,100,100,0.4)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function attachChartInteraction(){
    function handle(clientX){
      const rect = chartCanvas.getBoundingClientRect();
      const x = clientX - rect.left;
      const points = state.chartPoints;
      if(!points.length) return;
      const idx = Math.round((x / rect.width) * (points.length - 1));
      const clamped = Math.max(0, Math.min(points.length - 1, idx));
      drawChart(clamped);
      drawRsi(clamped);
    }
    chartCanvas.addEventListener("mousemove", e => handle(e.clientX));
    chartCanvas.addEventListener("mouseleave", () => { drawChart(); drawRsi(); });
    chartCanvas.addEventListener("touchstart", e => handle(e.touches[0].clientX), {passive:true});
    chartCanvas.addEventListener("touchmove", e => handle(e.touches[0].clientX), {passive:true});
    chartCanvas.addEventListener("touchend", () => { drawChart(); drawRsi(); });
  }

  function attachRangeTabs(){
    document.getElementById("rangeTabs").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-range]");
      if(!btn) return;
      document.querySelectorAll("#rangeTabs button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.range = btn.dataset.range;
      updateChart(state.range);
    });
  }

  window.addEventListener("resize", () => { drawChart(); drawRsi(); drawSparkline.lastCandles && drawSparkline(drawSparkline.lastCandles); });

  function init(){
    attachChartInteraction();
    attachRangeTabs();

    updatePrice();
    updateSparkline();
    updateDominance();
    updateFx();
    updateFng();
    updateHalving();
    updateLongTermMAs();
    updateChart(state.range);

    setInterval(updatePrice, 5000);
    setInterval(updateSparkline, 60000);
    setInterval(updateDominance, 120000);
    setInterval(updateFx, 600000);
    setInterval(updateFng, 600000);
    setInterval(updateHalving, 60000);
    setInterval(updateLongTermMAs, 30 * 60000);
    setInterval(() => updateChart(state.range), 60000);
  }

  init();
})();
</script>
</body>
</html>
