<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bitcoin University</title>
<style>
  :root{
    --orange:#f7931a;
    --red:#ef4444;
    --green:#16a34a;
    --gray:#9ca3af;
    --track:#e5e7eb;
    --bg:#ffffff;
    --text:#111111;
    --sub:#8b8b8b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:640px;
    margin:0 auto;
    padding:20px 20px 80px;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .back-link{
    color:var(--sub);
    text-decoration:none;
    font-size:20px;
    padding:4px 8px;
  }
  .coin-icon{
    width:36px;height:36px;border-radius:50%;
    background:var(--orange);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:700;
    flex-shrink:0;
  }
  .topbar h1{
    font-size:20px;margin:0;flex:1;font-weight:700;
  }
  .live-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--green);
  }
  .updated{
    font-size:12px;color:var(--sub);margin-bottom:20px;
  }

  .post-list{display:flex;flex-direction:column;gap:14px;margin-bottom:20px;}
  .post-item{
    display:block;
    border:1px solid var(--track);
    border-radius:10px;
    padding:14px;
    text-decoration:none;
    color:inherit;
  }
  .post-title{font-size:15px;font-weight:700;line-height:1.35;margin-bottom:6px;}
  .post-summary{font-size:12px;color:var(--sub);line-height:1.5;margin-bottom:8px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .post-meta{font-size:11px;color:var(--sub);}
  .post-source{color:var(--orange);font-weight:600;}

  .empty-state{
    text-align:center;color:var(--sub);font-size:13px;
    border:1px dashed var(--track);border-radius:10px;padding:32px 16px;line-height:1.6;
  }

  .status-line{
    text-align:center;font-size:11px;color:var(--sub);margin-top:8px;min-height:14px;
  }
  .source-note{
    text-align:center;font-size:11px;color:var(--sub);margin-top:24px;
  }
  .source-note a{color:inherit;}
  .bottom-nav{
    position:fixed;left:0;right:0;bottom:0;
    display:flex;
    background:var(--bg);
    border-top:1px solid var(--track);
    padding:6px 2px calc(6px + env(safe-area-inset-bottom));
    z-index:100;
  }
  .bottom-nav a{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    color:var(--sub);text-decoration:none;font-size:7px;padding:4px 1px;
  }
  .bottom-nav a .icon{font-size:15px;line-height:1;}
  .bottom-nav a.active{color:var(--orange);}

  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f0f0f;
      --text:#f2f2f2;
      --sub:#8f8f8f;
      --track:#2a2a2a;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back-link" href="index.html" title="대시보드로 돌아가기">←</a>
    <div class="coin-icon">📚</div>
    <h1>Bitcoin University</h1>
    <span class="live-dot" title="자동 갱신"></span>
  </header>
  <div class="updated" id="updatedLine">불러오는 중...</div>

  <div class="post-list" id="postList"></div>

  <p class="status-line" id="statusLine">&nbsp;</p>
  <p class="source-note" id="rawApiNote" style="display:none;"><a href="/api/university-news" target="_blank" rel="noopener">raw API 응답 보기 →</a></p>
  <p class="source-note" id="sourceNote">Data: <a href="https://bitcoin-university.beehiiv.com" target="_blank" rel="noopener">bitcoin-university.beehiiv.com</a> (RSS)</p>
</div>

<nav class="bottom-nav">
  <a href="index.html"><span class="icon">₿</span>Home</a>
  <a href="etf.html"><span class="icon">💰</span>ETF</a>
  <a href="assets.html"><span class="icon">🌐</span>Assets</a>
  <a href="onchain.html"><span class="icon">⛓️</span>On-Chain</a>
  <a href="news.html"><span class="icon">📰</span>News</a>
  <a href="university.html" class="active"><span class="icon">📚</span>University</a>
  <a href="cycles.html"><span class="icon">🔄</span>Cycles</a>
  <a href="dca.html"><span class="icon">🐷</span>DCA</a>
</nav>

<script>
(function(){
  "use strict";

  function setStatus(msg){ document.getElementById("statusLine").textContent = msg || " "; }

  function fmtDate(dateStr){
    if(!dateStr) return "";
    const d = new Date(dateStr);
    if(isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString("ko-KR", { year: "numeric", month: "short", day: "numeric" });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function render(posts){
    const list = document.getElementById("postList");
    if(!posts.length){
      list.innerHTML = `<div class="empty-state">아직 등록된 컬럼이 없어.<br>새 글이 올라오면 알려주면 여기에 추가돼.</div>`;
      return;
    }
    list.innerHTML = posts.map(p => `
      <a class="post-item" href="${escapeHtml(p.url)}" target="_blank" rel="noopener">
        <div class="post-title">${escapeHtml(p.title)}</div>
        ${p.summary ? `<div class="post-summary">${escapeHtml(p.summary)}</div>` : ""}
        <div class="post-meta"><span class="post-source">Bitcoin University</span> · ${fmtDate(p.publishedAt)}</div>
      </a>
    `).join("");
  }

  async function loadLiveFeed(){
    const res = await fetch("/api/university-news");
    if(!res.ok) throw new Error("API " + res.status);
    const data = await res.json();
    if(!data.posts || !data.posts.length) throw new Error("데이터 없음");
    return data.posts;
  }

  // Manually-curated fallback (see data/university-posts.json) in case the
  // beehiiv RSS feed ever breaks or the URL changes.
  async function loadStaticFallback(){
    const res = await fetch("/data/university-posts.json", { cache: "no-store" });
    if(!res.ok) throw new Error("데이터 로드 실패 " + res.status);
    const data = await res.json();
    return (data.posts || []).slice().sort((a,b) => new Date(b.publishedAt) - new Date(a.publishedAt));
  }

  async function load(){
    try{
      setStatus("");
      const posts = await loadLiveFeed();
      document.getElementById("updatedLine").textContent = "최근 글: " + (posts[0] ? fmtDate(posts[0].publishedAt) : "-");
      render(posts);
    }catch(e){
      document.getElementById("rawApiNote").style.display = "block";
      try{
        const posts = await loadStaticFallback();
        document.getElementById("updatedLine").textContent = "최근 글: " + (posts[0] ? fmtDate(posts[0].publishedAt) : "-");
        document.getElementById("sourceNote").innerHTML = 'Data: <a href="https://bitcoin-university.beehiiv.com" target="_blank" rel="noopener">bitcoin-university.beehiiv.com</a> · RSS 로드 실패로 수동 등록 목록 표시 중';
        setStatus("실시간 피드 로드 실패, 수동 등록 목록으로 표시: " + e.message);
        render(posts);
      }catch(e2){
        setStatus("데이터 로드 실패: " + e.message);
        render([]);
      }
    }
  }

  load();
})();
</script>
</body>
</html>
