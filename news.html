<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bitcoin News</title>
<style>
  :root{
    --orange:#f7931a;
    --red:#ef4444;
    --green:#16a34a;
    --gray:#9ca3af;
    --track:#e5e7eb;
    --bg:#ffffff;
    --text:#111111;
    --sub:#8b8b8b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:640px;
    margin:0 auto;
    padding:20px 20px 40px;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .back-link{
    color:var(--sub);
    text-decoration:none;
    font-size:20px;
    padding:4px 8px;
  }
  .coin-icon{
    width:36px;height:36px;border-radius:50%;
    background:var(--orange);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:700;
    flex-shrink:0;
  }
  .topbar h1{
    font-size:22px;margin:0;flex:1;font-weight:700;
  }
  .live-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--green);
  }
  .updated{
    font-size:12px;color:var(--sub);margin-bottom:20px;
  }

  .news-list{display:flex;flex-direction:column;gap:14px;margin-bottom:20px;}
  .news-item{
    display:flex;gap:12px;
    border:1px solid var(--track);
    border-radius:10px;
    padding:12px;
    text-decoration:none;
    color:inherit;
  }
  .news-thumb{
    width:76px;height:76px;flex-shrink:0;
    border-radius:6px;object-fit:cover;
    background:var(--track);
  }
  .news-body{min-width:0;display:flex;flex-direction:column;gap:4px;}
  .news-title{font-size:14px;font-weight:700;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .news-meta{font-size:11px;color:var(--sub);}
  .news-source{color:var(--orange);font-weight:600;}

  .status-line{
    text-align:center;font-size:11px;color:var(--sub);margin-top:8px;min-height:14px;
  }
  .source-note{
    text-align:center;font-size:11px;color:var(--sub);margin-top:24px;
  }
  .source-note a{color:inherit;}

  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f0f0f;
      --text:#f2f2f2;
      --sub:#8f8f8f;
      --track:#2a2a2a;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back-link" href="index.html" title="대시보드로 돌아가기">←</a>
    <div class="coin-icon">₿</div>
    <h1>Bitcoin News</h1>
    <span class="live-dot" title="자동 갱신"></span>
  </header>
  <div class="updated" id="updatedLine">불러오는 중...</div>

  <div class="news-list" id="newsList"></div>

  <p class="status-line" id="statusLine">&nbsp;</p>
  <p class="source-note" id="rawApiNote" style="display:none;"><a href="/api/news" target="_blank" rel="noopener">raw API 응답 보기 →</a></p>
  <p class="source-note">Data: CoinDesk, Cointelegraph, Bitcoin Magazine, Bitcoin.com (RSS) · Translated via Google Translate</p>
  <p class="source-note"><a href="index.html">← Bitcoin Dashboard</a> &nbsp;|&nbsp; <a href="etf.html">ETF Flow</a> &nbsp;|&nbsp; <a href="assets.html">Global Assets</a> &nbsp;|&nbsp; <a href="onchain.html">On-Chain</a> &nbsp;|&nbsp; <a href="cycles.html">Cycles & Macro →</a></p>
</div>

<script>
(function(){
  "use strict";

  function setStatus(msg){ document.getElementById("statusLine").textContent = msg || " "; }

  function timeAgo(ms){
    if(!ms) return "";
    const diffMin = Math.max(0, Math.round((Date.now() - ms) / 60000));
    if(diffMin < 60) return diffMin + "분 전";
    const diffHr = Math.round(diffMin / 60);
    if(diffHr < 24) return diffHr + "시간 전";
    return Math.round(diffHr / 24) + "일 전";
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function render(items){
    const list = document.getElementById("newsList");
    list.innerHTML = items.map(it => {
      const thumb = it.imageUrl
        ? `<img class="news-thumb" src="${escapeHtml(it.imageUrl)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
        : `<div class="news-thumb"></div>`;
      return `<a class="news-item" href="${escapeHtml(it.url)}" target="_blank" rel="noopener">
        ${thumb}
        <div class="news-body">
          <div class="news-title">${escapeHtml(it.titleKo || it.title)}</div>
          <div class="news-meta"><span class="news-source">${escapeHtml(it.source)}</span> · ${timeAgo(it.publishedAt)}</div>
        </div>
      </a>`;
    }).join("");
  }

  async function load(){
    try{
      setStatus("");
      const res = await fetch("/api/news");
      if(!res.ok) throw new Error("API " + res.status);
      const data = await res.json();
      if(!data.items || !data.items.length) throw new Error("데이터 없음");

      document.getElementById("updatedLine").textContent = "서버 갱신: " + new Date(data.fetchedAt).toLocaleString("ko-KR");
      render(data.items);
    }catch(e){
      setStatus("데이터 로드 실패: " + e.message);
      document.getElementById("rawApiNote").style.display = "block";
    }
  }

  load();
  setInterval(load, 10 * 60 * 1000);
})();
</script>
</body>
</html>
